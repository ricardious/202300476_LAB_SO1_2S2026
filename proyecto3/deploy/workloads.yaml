apiVersion: v1
kind: Service
metadata:
  name: api-rust
  namespace: so1-p3
spec:
  selector:
    app: api-rust
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-rust
  namespace: so1-p3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-rust
  template:
    metadata:
      labels:
        app: api-rust
    spec:
      containers:
      - name: api-rust
        image: localhost:5005/so1/rust:1.0.0
        env:
        - name: GO_API_URL
          value: http://go-ingest:8080/report
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 12Mi
          limits:
            cpu: 500m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        imagePullPolicy: Always
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: go-ingest
  namespace: so1-p3
spec:
  selector:
    app: go-ingest
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-ingest
  namespace: so1-p3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-ingest
  template:
    metadata:
      labels:
        app: go-ingest
    spec:
      containers:
      - name: api
        image: localhost:5005/so1/go:1.0.0
        env:
        - name: ROLE
          value: api
        - name: GOMAXPROCS
          value: '1'
        - name: GOMEMLIMIT
          value: 48MiB
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 20m
            memory: 20Mi
          limits:
            cpu: 500m
            memory: 80Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        imagePullPolicy: Always
      - name: client
        image: localhost:5005/so1/go:1.0.0
        env:
        - name: ROLE
          value: client
        - name: GOMAXPROCS
          value: '1'
        - name: GOMEMLIMIT
          value: 48MiB
        ports:
        - containerPort: 8081
        resources:
          requests:
            cpu: 20m
            memory: 20Mi
          limits:
            cpu: 500m
            memory: 80Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 2
          periodSeconds: 5
        imagePullPolicy: Always
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: go-writer
  namespace: so1-p3
spec:
  selector:
    app: go-writer
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-writer
  namespace: so1-p3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-writer
  template:
    metadata:
      labels:
        app: go-writer
    spec:
      containers:
      - name: server
        image: localhost:5005/so1/go:1.0.0
        env:
        - name: ROLE
          value: server
        - name: GOMAXPROCS
          value: '1'
        - name: GOMEMLIMIT
          value: 48MiB
        ports:
        - containerPort: 50051
        resources:
          requests:
            cpu: 20m
            memory: 20Mi
          limits:
            cpu: 500m
            memory: 80Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 2
          periodSeconds: 5
        imagePullPolicy: Always
      - name: writer
        image: localhost:5005/so1/go:1.0.0
        env:
        - name: ROLE
          value: writer
        - name: GOMAXPROCS
          value: '1'
        - name: GOMEMLIMIT
          value: 48MiB
        - name: AMQP_URL
          valueFrom:
            secretKeyRef:
              name: p3-auth
              key: amqp-url
        ports:
        - containerPort: 8082
        resources:
          requests:
            cpu: 20m
            memory: 20Mi
          limits:
            cpu: 500m
            memory: 80Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 2
          periodSeconds: 5
        imagePullPolicy: Always
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: consumer
  namespace: so1-p3
spec:
  selector:
    app: consumer
  ports:
  - name: metrics
    port: 9091
    targetPort: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: so1-p3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
      - name: consumer
        image: localhost:5005/so1/go:1.0.0
        env:
        - name: ROLE
          value: consumer
        - name: GOMAXPROCS
          value: '1'
        - name: GOMEMLIMIT
          value: 48MiB
        - name: AMQP_URL
          valueFrom:
            secretKeyRef:
              name: p3-auth
              key: amqp-url
