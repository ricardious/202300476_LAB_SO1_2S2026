          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9091
          initialDelaySeconds: 2
          periodSeconds: 5
        imagePullPolicy: Always
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: so1-p3
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: so1-p3
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: so1-p3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: localhost:5005/library/rabbitmq:4.1.4-alpine
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: so1
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: p3-auth
              key: rabbit-password
        - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
          value: +S 1:1 +A 4 -rabbit vm_memory_high_watermark {absolute,134217728}
            disk_free_limit 104857600
        - name: RABBITMQ_NODENAME
          value: rabbit@rabbitmq
        ports:
        - containerPort: 5672
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
        readinessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
        startupProbe:
          tcpSocket:
            port: 5672
          periodSeconds: 5
          failureThreshold: 36
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rabbitmq-data
      hostname: rabbitmq
  strategy:
    type: Recreate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: so1-p3
data:
  prometheus.yml: "global:\n  scrape_interval: 5s\nscrape_configs:\n- job_name: reports\n\
    \  static_configs:\n  - targets:\n    - consumer:9091\n"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: so1-p3
spec:
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: so1-p3
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: so1-p3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: localhost:5005/library/prometheus:v3.7.2
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=2h
        - --storage.tsdb.retention.size=128MB
        - --query.max-concurrency=2
        - --query.max-samples=100000
        env:
        - name: GOMAXPROCS
          value: '1'
        - name: GOMEMLIMIT
          value: 96MiB
        resources:
          requests:
            cpu: 25m
            memory: 48Mi
          limits:
            cpu: 500m
            memory: 160Mi
        ports:
        - containerPort: 9090
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data
  strategy:
    type: Recreate
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-rust
  namespace: so1-p3
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-rust
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 30
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
