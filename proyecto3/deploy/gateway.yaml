apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: so1-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: small
  namespace: so1-p3
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          image: localhost:5005/envoyproxy/envoy:distroless-v1.39.1
      envoyService:
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: military
  namespace: so1-p3
spec:
  gatewayClassName: so1-envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: small
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reports
  namespace: so1-p3
spec:
  parentRefs:
  - name: military
  rules:
  - matches:
    - path:
        type: Exact
        value: /grpc-202300476
    - path:
        type: Exact
        value: /dapr-202300476
    backendRefs:
    - name: api-rust
      port: 8080
